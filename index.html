<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">

        <div class="categories">
    <button class="category-btn politics" >Politics Quiz</button>
    <button class="category-btn music">Music Quiz</button>
    <button class="category-btn sports" >Sports Quiz</button>
        </div>
        <div class="timer">Time left: <span id="time">30</span>s</div>
    
    <div class="question">Question will appear here</div>
    <div class="options"></div>
    <div class="result">Your score: <span id="score">0</span></div>
    <button class="restart-btn">Re-start Quiz</button>

    </div>






 <script src="script.js"></script>
    
</body>
</html>
